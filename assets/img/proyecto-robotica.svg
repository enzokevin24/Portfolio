<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="robTitle">
  <title id="robTitle">Esquema de autito seguidor de línea en robótica escolar</title>
  <defs>
    <linearGradient id="robBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <rect width="640" height="380" rx="16" fill="url(#robBg)" />
  <!-- Pista / Circuito negro -->
  <path d="M 60 290 C 140 290, 170 110, 290 120 C 390 128, 395 270, 510 250 C 560 242, 580 180, 600 130" fill="none" stroke="#18181b" stroke-width="20" stroke-linecap="round" />
  <path d="M 60 290 C 140 290, 170 110, 290 120 C 390 128, 395 270, 510 250 C 560 242, 580 180, 600 130" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8" stroke-opacity="0.35" />

  <!-- Autito Seguidor de Línea (sobre la pista en x~290, y~120) -->
  <g transform="translate(290, 125) rotate(10)">
    <!-- Ruedas -->
    <rect x="-54" y="-44" width="28" height="12" rx="4" fill="#18181b" />
    <rect x="-54" y="32" width="28" height="12" rx="4" fill="#18181b" />
    <!-- Chasis rojo -->
    <rect x="-60" y="-34" width="120" height="68" rx="16" fill="url(#chassisGrad)" stroke="#7f1d1d" stroke-width="2" />
    <!-- Placa controladora -->
    <rect x="-36" y="-22" width="54" height="44" rx="6" fill="#ffffff" stroke="#fecaca" />
    <circle cx="-18" cy="-6" r="4" fill="#dc2626" />
    <circle cx="-4" cy="-6" r="4" fill="#18181b" />
    <rect x="-24" y="6" width="30" height="8" rx="2" fill="#991b1b" />
    <!-- Sensores IR frontales -->
    <rect x="48" y="-20" width="18" height="40" rx="4" fill="#18181b" />
    <circle cx="62" cy="-10" r="4" fill="#ef4444" />
    <circle cx="62" cy="10" r="4" fill="#ef4444" />
    <!-- Haz infrarrojo -->
    <polygon points="66,-14 96,-26 96,2" fill="#ef4444" fill-opacity="0.28" />
    <polygon points="66,6 96,-2 96,26" fill="#ef4444" fill-opacity="0.28" />
  </g>

  <!-- Etiquetas técnicas -->
  <rect x="38" y="34" width="228" height="58" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" />
  <text x="54" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Sensores Infrarrojos (IR)</text>
  <text x="54" y="76" font-family="system-ui, sans-serif" font-size="11" fill="#52525b">Lectura de contraste blanco/negro</text>

  <rect x="394" y="294" width="212" height="58" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" />
  <text x="410" y="318" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Control de Motores DC</text>
  <text x="410" y="336" font-family="system-ui, sans-serif" font-size="11" fill="#52525b">Corrección continua de trayectoria</text>
</svg>

